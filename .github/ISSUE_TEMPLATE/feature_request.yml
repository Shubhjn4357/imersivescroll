name: Feature request
description: Propose a new capability, adapter improvement, or docs enhancement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the workflow gap or product need.
      placeholder: I need a first-class way to render a contained immersive preview inside a dashboard layout.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, docs, or package change you want to see.
      placeholder: Add a viewport sizing mode that supports embedded scene containers and expose it in the React and Web adapters.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include links, screenshots, code snippets, or release constraints if they matter.
